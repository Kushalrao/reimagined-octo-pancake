import * as THREE from 'three';

// time of day: day until 16:30, evening until 17:45, sunset until 18:45, night until 06:00; ?phase=day|evening|sunset|night forces it (?night=1/0 still works)
const PHASE = (() => {
  const q = new URLSearchParams(location.search);
  if (q.has('phase')) return q.get('phase');
  if (q.has('night')) return q.get('night') !== '0' ? 'night' : 'day';
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  return (h >= 18.75 || h < 6) ? 'night' : h >= 17.75 ? 'sunset' : h >= 16.5 ? 'evening' : 'day';
})();
const NIGHT = PHASE === 'night', EVENING = PHASE === 'evening', SUNSET = PHASE === 'sunset';

  lhbblue:       { base: '#8fb8e0', baseD: '#6f98c0', bands: [[0.58, 0.86, '#8a9096', '#6c7278']], stripes: [[0.58, -4, '#f4f4f0']], door: '#8fb8e0', doorD: '#6f98c0', frame: '#f4f4f0', label: '#1e2e44', roof: '#9a9a96', cap: '#8fb8e0', cow: 0x8a9096 },

  uday:          { base: '#f2c230', baseD: '#d4a520', bands: [[0.60, 0.86, '#ef7f1a', '#c9640f']], stripes: [[0.60, -5, '#e04e8a']], door: '#ef7f1a', doorD: '#c9640f', frame: '#f2c230', label: '#4a2a0a', roof: '#9a9a96', cap: '#f2c230', cow: 0xef7f1a },

};
// vinyl artwork for the wrapped liveries (drawn over the base, under the stripes; skipped on the night glow mask)
function durontoArt(g, w, h) {   // "field full of flowers": green patches low on the body, flowers scattered over the side
  g.fillStyle = '#3a9a3a';
  for (let i = 0; i < 26; i++) { g.beginPath(); g.ellipse(rand(0, w), rand(h * 0.66, h * 0.84), rand(60, 140), rand(22, 46), 0, 0, 7); g.fill(); }
  g.fillStyle = '#2a7a2a'; g.fillRect(0, h * 0.80, w, h * 0.06);
  const cols = ['#e04e8a', '#ef7f1a', '#ffffff', '#c23a9a'];
  for (let i = 0; i < 90; i++) {
    const x = rand(0, w), y = rand(h * 0.06, h * 0.84), r = rand(7, 13); g.fillStyle = cols[i % 4];
    for (let k = 0; k < 5; k++) { g.beginPath(); g.arc(x + Math.cos(k * 1.2566) * r, y + Math.sin(k * 1.2566) * r, r * 0.6, 0, 7); g.fill(); }
    g.fillStyle = '#f2c230'; g.beginPath(); g.arc(x, y, r * 0.45, 0, 7); g.fill();
  }
}
function humsafarArt(g, w, h) {   // orange and green waves rolling along the skirt
  const wave = (yBase, amp, colour, phase) => { g.fillStyle = colour; g.beginPath(); g.moveTo(0, h); for (let x = 0; x <= w; x += 16) g.lineTo(x, yBase + Math.sin(x / 170 + phase) * amp); g.lineTo(w, h); g.closePath(); g.fill(); };
  wave(h * 0.66, h * 0.03, '#e8821c', 0); wave(h * 0.75, h * 0.03, '#3a9a3a', 1.6); wave(h * 0.82, h * 0.02, '#2a7a2a', 3.0);
}
function tejasArt(g, w, h) {   // orange sweep rising along the lower body, a darker trailing edge
  const sweep = (y0, y1, colour) => { g.fillStyle = colour; g.beginPath(); g.moveTo(0, h * 0.86); g.lineTo(0, y1); g.bezierCurveTo(w * 0.3, y1, w * 0.6, y0, w, y0); g.lineTo(w, h * 0.86); g.closePath(); g.fill(); };
  sweep(h * 0.56, h * 0.72, '#c45e12'); sweep(h * 0.60, h * 0.76, '#e9731b');
}
const LIVERY = LIVERIES[new URLSearchParams(location.search).get('livery')] ? new URLSearchParams(location.search).get('livery') : 'red';
const LIV = LIVERIES[LIVERY];
const LIVERY_HEX = LIV.cow;
const GLOW = NIGHT || SUNSET, GLOW_K = NIGHT ? 1.15 : 0.7;   // lit windows: full at night, just coming on at sunset
document.documentElement.classList.toggle('night', NIGHT);
// station variant: platform with a canopy on the back side, the train stops alongside
const STATION = new URLSearchParams(location.search).get('station') === '1';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ───────────────────────── renderer / scene / camera ─────────────────────────
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = NIGHT ? 1.0 : SUNSET ? 0.95 : EVENING ? 0.95 : 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// front-on like the reference: nearly side-on to the track, a touch of yaw so the train's nose shows, slightly above
const camera = new THREE.PerspectiveCamera(30, stage.clientWidth / stage.clientHeight, 0.1, 200);
camera.position.set(0, 11.5, 18.5);   // dead front, looking down at ~30°, so the track runs level across the card
camera.lookAt(0, 1.7, 0);              // aimed a touch higher so the wires, and a bird on them, sit clear of the top edge

// ───────────────────────── helpers ─────────────────────────
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const std = (color, roughness = 0.7, o = {}) => new THREE.MeshStandardMaterial({ color, roughness, metalness: 0.05, ...o });
const glow = (color, k = 1) => new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k) });
const JP = `'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif`;
// baked textures: every procedural canvas is painted once (?bake=1 posts them to a local bake server) and shipped as
// web/baked/<phase>-<station>-<n>.png, so startup skips the painting entirely; a missing bake falls back to drawing live
const BAKE = new URLSearchParams(location.search).get('bake') === '1';
// ?capture=1: pin the stage to 320×200 at the top-left and freeze time at 0, to screenshot the exact first frame (the app's placeholder)
const CAPTURE = new URLSearchParams(location.search).get('capture') === '1';
if (CAPTURE) Object.assign(document.getElementById('stage').style, { position: 'fixed', left: '0', top: '0', right: 'auto', bottom: 'auto', width: '320px', height: '200px' });
if (CAPTURE && new URLSearchParams(location.search).get('bg')) document.body.style.background = new URLSearchParams(location.search).get('bg');   // matte passes for transparent placeholders
const BAKE_KEY = `${PHASE}-${STATION ? 1 : 0}-${LIVERY}`;
let texIndex = 0; const bakeList = [];
const baked = await (async () => {
  if (BAKE) return null;
  try {
    const res = await fetch(`./baked/${BAKE_KEY}.json`); if (!res.ok) return null;
    const list = await res.json();
    const entries = await Promise.all(list.map(async (e) => {
      const img = new Image(); img.src = `./baked/${BAKE_KEY}-${e.n}.png`; await img.decode();
      return [e.n, img];
    }));
    return new Map(entries);
  } catch (e) { return null; }
})();
function canvasTex(w, h, draw) {
  const n = texIndex++;
  const img = baked && baked.get(n);
  if (img && img.naturalWidth === w && img.naturalHeight === h) {
    const t = new THREE.Texture(img); t.needsUpdate = true; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
    return t;
  }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  if (BAKE) bakeList.push({ n, w, h, c });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function boxB(w, h, d, mat, x, y0, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y0 + h / 2, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function cylB(rt, rb, h, mat, x, y0, z, parent = scene, seg = 14) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y0 + h / 2, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function rod(a, b, r, mat, parent = scene) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 6), mat);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  m.castShadow = true; parent.add(m); return m;
}
function plane(w, h, mat, x, y, z, ry = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.y = ry; parent.add(m); return m;
}
function flat(w, d, mat, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; parent.add(m); return m;
}

// ───────────────────────── light: clear morning sun by day, low orange sun in the evening, moonlight by night ─────────────────────────
scene.add(new THREE.HemisphereLight(NIGHT ? 0x3a4c74 : SUNSET ? 0xffb08c : EVENING ? 0xf7b89a : 0xdce8ff, NIGHT ? 0x10131c : SUNSET ? 0x5a4458 : EVENING ? 0x5a4a44 : 0x8a8276, NIGHT ? 0.9 : SUNSET ? 1.05 : EVENING ? 1.0 : 1.15));
const sun = new THREE.DirectionalLight(NIGHT ? 0x9fb3e6 : SUNSET ? 0xff8c4a : EVENING ? 0xffc091 : 0xfff3dd, NIGHT ? 1.4 : SUNSET ? 2.0 : EVENING ? 2.4 : 2.6);   // morning sun high and near-white; evening sun low; sunset sun on the horizon, deep orange; moon low
sun.position.set(SUNSET ? -26 : NIGHT || EVENING ? -22 : -16, SUNSET ? 3.5 : NIGHT || EVENING ? 9 : 18, SUNSET ? 14 : NIGHT || EVENING ? 16 : 14);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 80 });
sun.shadow.bias = -0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(NIGHT ? 0x4a5a80 : SUNSET ? 0xc088b0 : EVENING ? 0xffd0b0 : 0xe6eeff, NIGHT ? 0.25 : SUNSET ? 0.4 : EVENING ? 0.45 : 0.5);   // sunset: purple sky bounce from behind
fill.position.set(14, 10, -12);
scene.add(fill);

// ───────────────────────── diorama slab: grass, ballast, track, road crossing ─────────────────────────
const BL = 22, BW = 6.4, HALF = BL / 2, FH = 8.75,   /* FH: the furniture (masts, lamps) sits at the frame edges; the ballast/track (BL) runs on past them */ BZ0 = STATION ? -7.4 : -BW / 2, BZ1 = BW / 2;   // station: deeper at the back for a second track
{
  const s = new THREE.Shape(), r = 0.9, yA = -BZ1, yB = -BZ0;   // shape y maps to -z after the rotation below
  s.moveTo(-HALF + r, yA); s.lineTo(HALF - r, yA); s.absarc(HALF - r, yA + r, r, -Math.PI / 2, 0);
  s.lineTo(HALF, yB - r); s.absarc(HALF - r, yB - r, r, 0, Math.PI / 2);
  s.lineTo(-HALF + r, yB); s.absarc(-HALF + r, yB - r, r, Math.PI / 2, Math.PI);

  const grassTex = canvasTex(512, 512, (g, w, h) => {          // bare soil: the grass itself is instanced blades in clumps
    g.fillStyle = '#7d5f41'; g.fillRect(0, 0, w, h);

  // crossing: arms down and red lamps flashing from before the train arrives until it has cleared the slab;
  // then the arms rise and the signal shows steady green until the next train is due
  const u = t % PERIOD, CLEAR_A = 12.6, OPEN_T = 2.0, CLOSE_A = PERIOD - 3.5, CLOSE_T = 2.0;
  let gate = 0;   // 0 = arms down … 1 = arms up
  if (STATION) gate = 0;
  else if (u < CLEAR_A) gate = 0;
  else if (u < CLEAR_A + OPEN_T) gate = smooth((u - CLEAR_A) / OPEN_T);
  else if (u < CLOSE_A) gate = 1;
  else if (u < CLOSE_A + CLOSE_T) gate = 1 - smooth((u - CLOSE_A) / CLOSE_T);
  for (const b of barriers) b.rotation.z = gate * 1.45;
  const lineClear = gate >= 1;
  const phase = Math.floor(t * 2) % 2;
  lamps.forEach((l, i) => { if (lineClear) l.material.color.set(0x22e06a).multiplyScalar(2.6); else l.material.color.set(0xff2a1a).multiplyScalar(i % 2 === phase ? 3.5 : 0.25); });
  if (lamps.arrow) lamps.arrow.color.setScalar(lineClear ? 0.2 : 2.4);
  for (const f of fans) f.rotation.y += 0.25;
  lampLight.color.set(lineClear ? 0x22e06a : 0xff3020);
  lampLight.intensity = lineClear ? (NIGHT ? 4 : 2) : (NIGHT ? 7 : SUNSET ? 5 : 3);
  lampLight.position.x = RX + 2.2 + (phase ? 0.36 : -0.36);
  renderer.render(scene, camera);
  if (!window.__ready) { window.__ready = true; try { window.webkit.messageHandlers.ready.postMessage('ready'); } catch (e) {} }   // tell the app the first frame is on screen
}
window.setPaused = (p) => {
  const next = !!p;
  if (next === paused) return;
  paused = next;
  if (paused) cancelAnimationFrame(rafId); else rafId = requestAnimationFrame(tick);
};
if (BAKE) {   // hand every painted canvas to the bake server, then the manifest
  (async () => {
    await Promise.all(bakeList.map((e) => fetch('/bake', { method: 'POST', body: JSON.stringify({ key: BAKE_KEY, n: e.n, data: e.c.toDataURL('image/png') }) })));
    await fetch('/manifest', { method: 'POST', body: JSON.stringify({ key: BAKE_KEY, list: bakeList.map((e) => ({ n: e.n, w: e.w, h: e.h })) }) });
    console.log('BAKED ' + BAKE_KEY + ' ' + bakeList.length);
  })();
}
clock.getDelta();
tick();
addEventListener('resize', () => { renderer.setSize(stage.clientWidth, stage.clientHeight); camera.aspect = stage.clientWidth / stage.clientHeight; camera.updateProjectionMatrix(); });
</script>
</body>
</html>
