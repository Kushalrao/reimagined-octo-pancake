name: StationCard
options:
  bundleIdPrefix: com.kushal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  StationCard:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Station Card
        UILaunchScreen: {}
        UIAppFonts: [Inter.ttf, LightTextTrial-Light.otf, LightTextTrial-Regular.otf, LightTextTrial-Bold.otf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kushal.stationcard
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D76GU59P59
